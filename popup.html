<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DexScreener Trader</title>
  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0e1117;
      color: #fff;
      width: 340px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    button {
      background: #00c896;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      transition: background 0.2s ease-in-out;
    }
    button:hover {
      background: #00e0aa;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h2>DexScreener Trader v4.6</h2>
  <p>Trade directly on DexScreener using Solana + FluxBeam.</p>
  <button id="connectBtn">Connect Wallet</button>
  <button id="tradeBtn" style="margin-top:10px;">Execute Trade</button>
  <div class="status" id="status">Disconnected</div>

  <script src="libs/web3.js"></script>
  <script>
    const connectBtn = document.getElementById('connectBtn');
    const tradeBtn = document.getElementById('tradeBtn');
    const statusDiv = document.getElementById('status');

    let wallet = null;

    connectBtn.addEventListener('click', async () => {
      try {
        if (window.solana && window.solana.isPhantom) {
          const response = await window.solana.connect();
          wallet = response.publicKey.toString();
          statusDiv.textContent = `Connected: ${wallet.slice(0, 6)}...${wallet.slice(-4)}`;
        } else {
          statusDiv.textContent = 'Phantom wallet not detected.';
        }
      } catch (err) {
        console.error(err);
        statusDiv.textContent = 'Connection failed.';
      }
    });

    tradeBtn.addEventListener('click', async () => {
      if (!wallet) return alert('Please connect wallet first.');

      try {
        const endpoint = "https://api.fluxbeam.xyz/trade";
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            wallet,
            action: "buy",
            token: "SOL",
            amount: 0.1
          })
        });

        const result = await res.json();
        statusDiv.textContent = `Trade sent: ${result.txSignature || 'pending...'}`;
      } catch (err) {
        console.error(err);
        statusDiv.textContent = 'Trade failed.';
      }
    });
  </script>
</body>
</html>
