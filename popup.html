<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DexScreener Trader</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      width: 340px;
      min-height: 420px;
      background-color: #0a0a0a;
      color: #f2f2f2;
      font-family: "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      text-align: center;
      color: #00ffa3;
    }
    .wallet-section, .trade-section {
      width: 100%;
      background: #111;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      box-shadow: 0 0 8px rgba(0,255,163,0.1);
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background-color: #00ffa3;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #00cc82;
    }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      margin-top: 6px;
      font-size: 14px;
    }
    .footer {
      margin-top: auto;
      font-size: 12px;
      opacity: 0.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>DexScreener Trader</h1>

  <div class="wallet-section">
    <h2>Wallet</h2>
    <p id="walletAddress">Not connected</p>
    <button id="connectWallet">Connect Wallet</button>
  </div>

  <div class="trade-section">
    <h2>Trade</h2>
    <input type="text" id="tokenAddress" placeholder="Enter token address..." />
    <input type="number" id="amount" placeholder="Amount (SOL)" />
    <button id="tradeBtn">Execute Trade</button>
  </div>

  <div class="footer">
    <p>Powered by Fluxbeam API + Solana Web3.js</p>
  </div>

  <!-- Scripts -->
  <script src="libs/web3.min.js"></script>
  <script src="wallet.js"></script>
  <script src="fluxbeam.js"></script>
  <script src="popup.js"></script>
</body>
</html>
