workflows:
  safari_extension_build:
    name: Dexscreener Trader Safari Extension
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        APP_NAME: "Dexscreener-trader-extension"
    scripts:
      - name: Verify manifest and prepare
        script: |
          echo "🧩 Checking manifest.json..."
          if [ ! -f "manifest.json" ]; then
            echo "❌ manifest.json not found!"
            exit 1
          fi
          MANIFEST_VERSION=$(grep '"manifest_version"' manifest.json | grep -o '[0-9]*')
          echo "Manifest version: $MANIFEST_VERSION"
          if [ "$MANIFEST_VERSION" -eq 3 ]; then
            echo "⚠️ Detected manifest v3 — converting to v2 for Safari compatibility..."
            sed -i '' 's/"manifest_version": 3/"manifest_version": 2/' manifest.json
          fi

      - name: Convert Chrome extension to Safari
        script: |
          echo "🧩 Running safari-web-extension-converter..."
          mkdir -p /tmp/safari_build
          xcrun safari-web-extension-converter . \
            --no-prompt \
            --force \
            --project-location /tmp/safari_build
          echo "✅ Safari project created in /tmp/safari_build"
          ls -la /tmp/safari_build

      - name: Build Safari extension app
        script: |
          echo "🚀 Building Safari extension..."
          PROJECT=$(find /tmp/safari_build -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "❌ No .xcodeproj found in safari build directory."
            exit 1
          fi
          echo "✅ Found project: $PROJECT"

          echo "🔍 Listing available schemes..."
          xcodebuild -list -project "$PROJECT"

          SCHEME=$(xcodebuild -list -project "$PROJECT" -json | grep -A 1 '"schemes"' | tail -n 1 | tr -d '", ')
          if [ -z "$SCHEME" ]; then
            echo "⚠️ No scheme found, using fallback scheme detection..."
            SCHEME=$(basename "$PROJECT" .xcodeproj)
          fi

          echo "✅ Using scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO | xcpretty

      - name: Package Safari app
        script: |
          echo "📦 Packaging Safari app..."
          mkdir -p $CM_BUILD_DIR/output
          find /tmp/safari_build -name "*.app" -exec cp -r {} $CM_BUILD_DIR/output/ \;

          echo "🗜️ Creating .zip bundle..."
          cd $CM_BUILD_DIR/output
          zip -r Safari_Extension_Build.zip ./*
          echo "✅ Output packaged successfully at $CM_BUILD_DIR/output/Safari_Extension_Build.zip"

    artifacts:
      - output/**
      - /tmp/safari_build/**/*.xcodeproj
      - /tmp/safari_build/**/*.app

    publishing:
      email:
        recipients:
          - Tradezconsulting@icloud.com
