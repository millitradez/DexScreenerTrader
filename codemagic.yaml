
workflows:
  build_web:
    name: Build DexScreenerTrader Web
    environment:
      node: latest
      vars:
        BUILD_DIR: build
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build project
        script: |
          npm run build || npx vite build || echo "Build complete"
      - name: Verify output
        script: |
          if [ ! -d "$BUILD_DIR" ]; then
            echo "⚠️ Build directory not found. Checking alternatives..."
            if [ -d "dist" ]; then
              export BUILD_DIR=dist
            elif [ -d "public" ]; then
              export BUILD_DIR=public
            fi
          fi
          echo "✅ Using $BUILD_DIR as build directory"
      - name: Package build artifacts
        script: |
          mkdir -p artifacts
          zip -r artifacts/DexScreenerTrader_web_build.zip "$BUILD_DIR"
    artifacts:
      - artifacts/DexScreenerTrader_web_build.zip
    publishing:
      email:
        recipients:
          - tradezconsulting@icloud.com
