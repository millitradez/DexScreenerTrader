workflows:
  dexscreener_trader_build:
    name: Dexscreener Trader Extension
    environment:
      vars:
        NODE_VERSION: 18
    scripts:
      - name: Install dependencies
        script: |
          if [ -f package.json ]; then
            npm install
          fi
      - name: Build project
        script: |
          echo "Building Safari web extension..."
          mkdir -p build
          cp -r index.html manifest.json main.js icon.png build/
          cd build
          zip -r ../DexscreenerTrader_Extension.zip .
    artifacts:
      - DexscreenerTrader_Extension.zip
