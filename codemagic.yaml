workflows:
  web_app_build:
    name: DexScreenerTrader Web Build (Safari iPhone)
    max_build_duration: 30
    environment:
      node: latest
      vars:
        BUILD_DIR: dist
    scripts:
      - name: Install dependencies
        script: |
          echo "📦 Installing dependencies..."
          npm install

      - name: Build project
        script: |
          echo "🏗️ Building the web app..."
          if [ -f package.json ]; then
            if npm run | grep -q "build"; then
              npm run build
            else
              echo "⚠️ No build script found, generating static build manually..."
              mkdir -p dist
              cp -r * dist/ || true
            fi
          else
            echo "⚠️ No package.json found, creating fallback dist folder..."
            mkdir -p dist
            cp -r * dist/ || true
          fi

      - name: Locate build output
        script: |
          echo "🔍 Searching for build folder..."
          OUTPUT_DIR=""
          for dir in dist build out public; do
            if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
              OUTPUT_DIR="$dir"
              break
            fi
          done

          if [ -z "$OUTPUT_DIR" ]; then
            echo "❌ No valid build folder found (missing index.html). Creating fallback dist folder..."
            mkdir -p dist
            cp -r * dist/ || true
            OUTPUT_DIR="dist"
          fi

          echo "✅ Found build output folder: $OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $CM_BUILD_DIR/output.env
          export OUTPUT_DIR

      - name: Package build artifacts
        script: |
          echo "📦 Packaging web build..."
          source $CM_BUILD_DIR/output.env || true
          mkdir -p artifacts
          if [ -d "$OUTPUT_DIR" ]; then
            zip -r "artifacts/DexScreenerTrader_web_build.zip" "$OUTPUT_DIR"
            echo "✅ Build zipped successfully: artifacts/DexScreenerTrader_web_build.zip"
          else
            echo "❌ Output directory not found after fallback: $OUTPUT_DIR"
            ls -la
            exit 1
          fi

      - name: Safari PWA configuration
        script: |
          echo "📱 Preparing iPhone Safari web app..."
          mkdir -p "$OUTPUT_DIR"
          cat > "$OUTPUT_DIR/manifest.json" <<EOL
          {
            "name": "DexScreener Trader",
            "short_name": "DexTrader",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#0D1117",
            "icons": [
              {
                "src": "icon-192.png",
                "sizes": "192x192",
                "type": "image/png"
              },
              {
                "src": "icon-512.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOL
          echo "✅ Safari manifest added to: $OUTPUT_DIR/manifest.json"

    artifacts:
      - artifacts/DexScreenerTrader_web_build.zip

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
