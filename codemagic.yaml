workflows:
  web_app_build:
    name: DexScreenerTrader Web Build (Safari iPhone)
    max_build_duration: 30
    environment:
      node: latest
      vars:
        BUILD_DIR: dist
    scripts:
      - name: Install dependencies
        script: |
          echo "📦 Installing dependencies..."
          npm install

      - name: Build project
        script: |
          echo "🏗️ Building the web app..."
          npm run build || npm run build:web || npm run export || echo "⚠️ No build script, continuing..."

      - name: Locate build output
        script: |
          echo "🔍 Searching for build folder..."
          OUTPUT_DIR=""
          for dir in dist build public out; do
            if [ -d "$dir" ]; then
              OUTPUT_DIR="$dir"
              break
            fi
          done
          if [ -z "$OUTPUT_DIR" ]; then
            echo "❌ No build folder found. Listing contents..."
            ls -R
            exit 1
          fi
          echo "✅ Found build output folder: $OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> .env.local
          export OUTPUT_DIR

      - name: Package build artifacts
        script: |
          echo "📦 Packaging web build..."
          mkdir -p artifacts
          if [ -d "$OUTPUT_DIR" ]; then
            zip -r "artifacts/DexScreenerTrader_web_build.zip" "$OUTPUT_DIR"
            echo "✅ Build zipped successfully: artifacts/DexScreenerTrader_web_build.zip"
          else
            echo "❌ Output directory not found: $OUTPUT_DIR"
            exit 1
          fi

      - name: Safari PWA configuration
        script: |
          echo "📱 Preparing iPhone Safari web app..."
          mkdir -p safari_config
          cat > safari_config/manifest.json <<EOL
          {
            "name": "DexScreener Trader",
            "short_name": "DexTrader",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#0D1117",
            "icons": [
              {
                "src": "icon-192.png",
                "sizes": "192x192",
                "type": "image/png"
              },
              {
                "src": "icon-512.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOL
          echo "✅ Safari manifest added."

    artifacts:
      - artifacts/DexScreenerTrader_web_build.zip

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
