workflows:
  safari_extension_ios:
    name: Dexscreener Trader iOS Build
    environment:
      vars:
        XCODE_PROJECT: "DexscreenerTrader.xcodeproj"
        XCODE_SCHEME: "DexscreenerTrader"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          echo "Installing dependencies..."
          if [ -f "package.json" ]; then
            npm install
          fi
          if [ -f "Podfile" ]; then
            pod install
          fi
      - name: Build Safari Web Extension for iOS
        script: |
          echo "Building Safari Web Extension..."
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            clean build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Release-iphoneos/**/*.ipa
      - build/Release-iphoneos/**/*.app
    publishing:
      email:
        recipients:
          - millitradez@gmail.com
